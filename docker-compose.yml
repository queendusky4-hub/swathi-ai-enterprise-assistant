services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swathi-ai-api
    command:
      - python
      - -m
      - uvicorn
      - swathi_ai.api:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
    volumes:
      - ./data:/app/data
      - ./model:/app/model:ro
      - huggingface-cache:/home/appuser/.cache/huggingface
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8000/health',
          timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: swathi-ai-streamlit
    command:
      - python
      - -m
      - streamlit
      - run
      - app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      PYTHONPATH: /app/src
      API_BASE_URL: http://api:8000
    volumes:
      - ./data:/app/data
      - ./model:/app/model:ro
      - huggingface-cache:/home/appuser/.cache/huggingface
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >
          import urllib.request;
          urllib.request.urlopen(
          'http://localhost:8501/_stcore/health',
          timeout=5)
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  prometheus:
    image: prom/prometheus
    container_name: swathi-ai-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - api
    restart: unless-stopped

  grafana:
    image: grafana/grafana
    container_name: swathi-ai-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  huggingface-cache:
  prometheus-data:
  grafana-data: